name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend test environment (uses in-memory SQLite, no external DB needed)
  DATABASE_URL: "sqlite:///:memory:"
  ENVIRONMENT: test
  LOG_LEVEL: WARNING
  SECRET_KEY: ci_test_secret_key_not_for_production
  # Stubbed API keys (agents are mocked in tests)
  OPENAI_API_KEY: sk-test-placeholder
  GEMINI_API_KEY: test-placeholder

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Lint, Type-check, Unit Tests
  # ─────────────────────────────────────────────
  backend:
    name: "Backend — Lint & Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run tests with pytest
        run: uv run pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # JOB 2: Frontend — Lint, Type-check, Build
  # ─────────────────────────────────────────────
  frontend:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with Oxlint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: TypeScript type-check & build
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 3: Security — Dependency Audit
  # ─────────────────────────────────────────────
  security:
    name: "Security — Dependency Audit"
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          cd backend
          uv export --no-dev --format requirements-txt > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --ignore-vuln PYSEC-2024-232
        continue-on-error: true  # Non-blocking; change to false to enforce hard stop

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true  # Non-blocking; change to false to enforce hard stop
